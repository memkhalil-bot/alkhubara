<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الخبراء | لوحة النظام</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
:root{font-family:Cairo,Tahoma,Arial,sans-serif;color:#193c31;background:#f4f7f5}*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #e3af55;outline-offset:2px}
#loading{display:grid;place-content:center;height:100dvh;text-align:center;color:#416b59}#app{display:none;height:100dvh;overflow:hidden}
.sidebar{width:260px;flex:0 0 260px;display:flex;flex-direction:column;background:#fff;border-left:1px solid #dce9df;height:100dvh;z-index:21}
.brand{padding:23px 18px;display:flex;gap:10px;align-items:center;border-bottom:1px solid #e5ede7}.logo{width:40px;height:40px;border-radius:12px;background:#12664d;color:#fff;display:grid;place-items:center;font-size:22px;font-weight:800}.brand strong{font-size:16px}.brand small{font-size:10px;color:#718779;display:block}.nav{padding:16px 10px;overflow-y:auto;flex:1}.navgroup{margin-bottom:17px}.navtitle{font-size:10px;color:#819789;font-weight:800;margin:0 12px 7px}.navbtn{width:100%;display:flex;gap:11px;align-items:center;padding:11px 12px;min-height:44px;border-radius:9px;text-align:right;background:transparent;color:#476355;font-size:12px;font-weight:600}.navbtn:hover{background:#f0f7f2}.navbtn.active{background:#e7f4eb;color:#125b43;font-weight:800}.navbtn.active:after{content:"";width:3px;height:20px;border-radius:4px;background:#137050;margin-right:auto}.navicon{width:20px;font-size:17px;text-align:center}.foot{border-top:1px solid #e3ece5;padding:14px;font-size:12px}.foot small{display:block;color:#7c9083}.logoutmobile{display:none}
.work{flex:1;min-width:0;display:flex;flex-direction:column;height:100dvh}.topbar{height:68px;min-height:68px;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 22px;background:#fff;border-bottom:1px solid #dce9df}.title{font-size:16px;font-weight:800}.crumb{font-size:10px;color:#7b8c80}.actions{display:flex;align-items:center;gap:10px}.actions button{border-radius:8px;min-height:38px;padding:7px 12px;background:#edf4ef;color:#285b44;font-size:12px;font-weight:700}.greeting{font-size:12px;color:#165f48;font-weight:800;white-space:nowrap}.greeting small{display:block;color:#779083;font-size:10px;font-weight:400}.area{padding:13px 17px;min-height:0;flex:1}.framebox{height:100%;border:1px solid #dce8df;border-radius:12px;background:#fff;overflow:hidden;position:relative}.framebox iframe{height:100%;width:100%;border:0;background:#f4f7f5}#busy{position:absolute;inset:0;background:#f8faf8;display:grid;place-content:center;color:#678174;z-index:2}#busy[hidden]{display:none}.menubtn,.overlay{display:none}
@media(max-width:740px){.sidebar{position:fixed;right:0;top:0;width:min(310px,86vw);transform:translateX(110%);transition:transform .2s;box-shadow:-8px 0 35px #0002}.opened .sidebar{transform:translateX(0)}.overlay{position:fixed;inset:0;background:#10271985;z-index:20}.opened .overlay{display:block}.menubtn{display:block}.topbar{height:60px;min-height:60px;padding:0 9px}.title{font-size:13px}.crumb{font-size:9px}.actions .hide-mobile{display:none}.greeting{font-size:11px}.greeting small{display:none}.area{padding:0}.framebox{border:0;border-radius:0}.logoutmobile{display:block;margin:8px;background:#e9f2ed;padding:12px;border-radius:8px;color:#195640;font-size:12px}}
</style></head><body><div id="loading">جارٍ تحميل نظام مركز الخبراء...</div><div id="app"><div id="overlay" class="overlay"></div><aside class="sidebar"><div class="brand"><span class="logo">خ</span><div><strong>الخبراء التعليمي</strong><small>إدارة وتشغيل المركز</small></div></div><nav id="nav" class="nav" aria-label="قائمة الوحدات"></nav><button id="mobileLogout" class="logoutmobile">تسجيل الخروج</button><div class="foot"><strong id="username">—</strong><small id="role">—</small></div></aside><section class="work"><div class="topbar"><div class="actions"><button id="menu" class="menubtn" aria-label="فتح القائمة" aria-expanded="false">☰</button><div><div id="title" class="title">الرئيسية</div><div id="crumb" class="crumb">مركز الخبراء / الرئيسية</div></div></div><div class="actions"><div id="greeting" class="greeting"></div><button id="notificationBell" type="button" title="مركز الإشعارات" aria-label="الإشعارات">🔔 <span id="notificationCount" style="font-size:10px"></span></button><button id="refresh" class="hide-mobile">تحديث</button><button id="logout" class="hide-mobile">خروج</button></div></div><div class="area"><div class="framebox"><div id="busy">جارٍ فتح الوحدة...</div><iframe id="frame" title="الوحدة الحالية"></iframe></div></div></section></div>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const sb=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co',"sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY"),$=id=>document.getElementById(id);
let profile=null,rights=new Set(),items=[],active='';
const groups=[
 ['الرئيسية',[['notifications','مركز الإشعارات','notifications.html','🔔',[]],['executive','المؤشرات التنفيذية','executive.html','▤',['executive.view']]]],
 ['الإدارة التعليمية',[['people','الطلاب والمدرسون','people.html','♙',['students.view','students.edit','teachers.view','teachers.edit']],['operations','الحصص والخدمات','operations.html','▦',['lessons.view','lessons.edit','services.view','services.edit']],['import','استيراد Excel','import.html','⇧',['students.edit','teachers.edit']]]],
 ['الإدارة المالية',[['finance','الإيرادات والمصروفات','finance.html','◈',['finance.view','finance.edit']],['pricing','التسعير والمستحقات','pricing.html','%', ['pricing.view','pricing.edit']],['invoices','الفواتير والمطابقة','invoices.html','▧',['invoices.view','invoices.create','invoices.allocate']],['balances','أرصدة الطلاب والمدرسين','balances.html','≋',['finance.view','finance.edit']]]],
 ['التقارير والإدارة',[['reports','التقارير وسجل العمليات','reports.html','▥',['reports.view','audit.view']],['users','المستخدمون والصلاحيات','users.html','⚙',['__super_admin']]]]
];
function permitted(entry){return entry[0]==='notifications'||profile.role==='super_admin'||entry[4].some(k=>rights.has(k))}
function greeting(){const hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Qatar',hour:'2-digit',hourCycle:'h23'}).format(new Date()));
const text=hour>=5&&hour<12?'صباح الخير':hour<18&&hour>=12?'مساء الخير':'مساء النور';const first=(profile.full_name||'').trim().split(/\s+/)[0]||'أهلًا';$('greeting').textContent=text+'، '+first}
function closeMenu(){document.body.classList.remove('opened');$('menu').setAttribute('aria-expanded','false')}
function show(id,replace=false){const found=items.find(x=>x[0]===id);if(!found)return;active=id;$('title').textContent=found[1];$('crumb').textContent='مركز الخبراء / '+found[1];document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.id===id));const src='./'+found[2];if($('frame').getAttribute('src')!==src){$('busy').hidden=false;$('frame').setAttribute('src',src)}closeMenu();if(location.hash!=='#'+id){if(replace)history.replaceState(null,'','#'+id);else history.pushState(null,'','#'+id)}}
function menu(){const nav=$('nav');nav.replaceChildren();items=[];for(const [label,collection]of groups){const allowed=collection.filter(permitted);if(!allowed.length)continue;items.push(...allowed);const sec=document.createElement('section');sec.className='navgroup';const h=document.createElement('div');h.className='navtitle';h.textContent=label;sec.append(h);for(const entry of allowed){const b=document.createElement('button');b.className='navbtn';b.dataset.id=entry[0];const i=document.createElement('span');i.className='navicon';i.textContent=entry[3];const t=document.createElement('span');t.textContent=entry[1];b.append(i,t);b.onclick=()=>show(entry[0]);sec.append(b)}nav.append(sec)}}
$('frame').addEventListener('load',()=>{$('busy').hidden=true;try{$('frame').contentDocument.addEventListener('click',e=>{const a=e.target.closest?.('a[href]');if(!a)return;const u=new URL(a.href,location.href);if(u.origin!==location.origin)return;const path=u.pathname.split('/').pop();if(path==='dashboard.html'){e.preventDefault();show(items[0][0]);return}const match=items.find(x=>x[2]===path);if(match){e.preventDefault();show(match[0])}},true)}catch(e){}});
$('menu').onclick=()=>{const expanded=document.body.classList.toggle('opened');$('menu').setAttribute('aria-expanded',String(expanded))};$('overlay').onclick=closeMenu;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
$('notificationBell').onclick=()=>show('notifications');
async function refreshNotificationCount(){try{const {count,error}=await sb.from('notifications').select('id',{count:'exact',head:true}).is('read_at',null);if(!error){$('notificationCount').textContent=count?String(count>99?'99+':count):'';$('notificationBell').setAttribute('aria-label',count?count+' إشعارات غير مقروءة':'لا توجد إشعارات غير مقروءة')}}catch(e){}}
setInterval(refreshNotificationCount,45000);
$('refresh').onclick=()=>{if(active)$('frame').contentWindow.location.reload()};async function logout(){await sb.auth.signOut();location.replace('./login.html')}$('logout').onclick=logout;$('mobileLogout').onclick=logout;
window.addEventListener('message',event=>{if(event.origin!==location.origin||event.source!==$('frame').contentWindow)return;const data=event.data;if(data?.type==='alkhubara:notifications-changed'){refreshNotificationCount();return}if(data?.type==='alkhubara:navigate'&&typeof data.route==='string'&&items.some(x=>x[0]===data.route))show(data.route)});
window.onpopstate=()=>{const id=location.hash.slice(1);show(items.some(x=>x[0]===id)?id:items[0][0],true)};
(async()=>{try{const{data:{user},error}=await sb.auth.getUser();if(error||!user)throw Error('auth');const{data:p,error:pe}=await sb.from('staff_profiles').select('full_name,role,is_active').eq('user_id',user.id).single();if(pe||!p?.is_active)throw Error('role');profile=p;const{data:access,error:ae}=await sb.from('user_permissions').select('permission');if(ae)throw Error('access');rights=new Set((access||[]).map(x=>x.permission));$('username').textContent=p.full_name||user.email;$('role').textContent=p.role==='super_admin'?'مدير عام':'موظف بصلاحيات مخصصة';menu();greeting();refreshNotificationCount();if(!items.length)throw Error('no-access');$('loading').style.display='none';$('app').style.display='flex';const chosen=location.hash.slice(1);show(items.some(x=>x[0]===chosen)?chosen:items[0][0],true)}catch(e){location.replace('./login.html')}})();
</script></body></html>
