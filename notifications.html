<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الإشعارات | الخبراء</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;font-family:Cairo,Tahoma,Arial,sans-serif;color:#173a30}main{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}.muted{font-size:12px;color:#708578}.box{background:white;border-radius:14px;border:1px solid #dce9e0;padding:19px;margin-bottom:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;font-size:12px;border-radius:9px;padding:9px 13px;min-height:40px;cursor:pointer}button{background:#12684e;color:#fff;border:0;font-weight:700}button.secondary{background:#e7f2e9;color:#15523d}button:disabled{opacity:.5}.card{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:14px 12px;border-bottom:1px solid #edf1ed}.card.unread{background:#f0faf3;border-right:3px solid #148159}.card strong{font-size:13px}.card p{font-size:12px;color:#536e5c;margin:4px 0}.card small{font-size:11px;color:#788c80}.actions{display:flex;gap:7px;flex-wrap:wrap}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;flex-wrap:wrap}.state{padding:25px;text-align:center;color:#6d8575}@media(max-width:560px){main{padding:10px}.card{align-items:flex-start;flex-direction:column}.actions{width:100%}}
.selection{display:flex;align-items:center;gap:7px;font-size:12px}.selection input,.select-notification{width:17px;height:17px;accent-color:#12684e}.card-body{flex:1;min-width:0}.card .danger{background:#fff2f0;color:#a3322c;border:1px solid #f1ceca}.toolbar .danger{background:#fff2f0;color:#a3322c;border:1px solid #f1ceca}.card .actions button{white-space:nowrap}.notification-tools{margin-top:12px}.card{justify-content:flex-start}.card .actions{margin-inline-start:auto}@media(max-width:560px){.card .actions{margin-inline-start:0}.notification-tools button{flex:1}}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><header><div><h1>مركز الإشعارات</h1><div class="muted">الأحداث المرتبطة بصلاحيات حسابك فقط</div></div><div class="toolbar"><button class="secondary" id="all">تعليم الكل كمقروء</button><button class="secondary" id="clearRead">مسح المقروءة</button><button class="secondary" id="refresh">تحديث</button></div></header><div class="box"><div class="toolbar"><label>عرض <select id="filter"><option value="all">الكل</option><option value="actions">تحتاج متابعة</option><option value="information">معلوماتية</option><option value="unread">غير المقروء</option><option value="read">المقروءة</option><option value="approvals">الاعتمادات</option><option value="finance">المالية</option><option value="lessons">الحصص</option></select></label><label>عدد الإشعارات <select id="size"><option value="20" selected>20</option><option value="50">50</option></select></label><span id="counter" class="muted"></span><span class="muted">تُجمع التنبيهات المعلوماتية المتشابهة داخل الصفحة دون حذف أي إشعار</span></div><div class="toolbar notification-tools"><label class="selection"><input id="selectPage" type="checkbox">تحديد إشعارات الصفحة</label><button id="deleteSelected" class="danger" disabled>مسح المحدد (0)</button></div><div id="results" role="status" class="state">جارٍ تحميل الإشعارات…</div><div class="pagination"><button id="prev" class="secondary">السابق</button><span id="pages" class="muted"></span><button id="next" class="secondary">التالي</button></div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co',"sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY"),$=id=>document.getElementById(id);
let page=0,rows=[],total=0,uid='',selected=new Set();
const safeDate=s=>new Intl.DateTimeFormat('ar-QA',{timeZone:'Asia/Qatar',dateStyle:'medium',timeStyle:'short'}).format(new Date(s));
function changed(){try{parent.postMessage({type:'alkhubara:notifications-changed'},location.origin)}catch(e){}}
function syncSelection(){const shown=rows.map(n=>n.id);$('selectPage').checked=shown.length>0&&shown.every(id=>selected.has(id));$('deleteSelected').disabled=selected.size===0;$('deleteSelected').textContent='مسح المحدد ('+selected.size+')'}
const actionTypes=['expense.submit','expense.clarify','expense.reply'];
function isAction(n){return actionTypes.includes(String(n.event_type||'').toLowerCase())}
function groupedRows(data){const result=[],index=new Map();for(const n of data){const key=!isAction(n)&&String(n.event_type||'').startsWith('audit.')?[n.event_type,n.title,n.message,n.target_path,n.read_at?'read':'unread'].join('|'):null;if(key&&index.has(key)){index.get(key).members.push(n);continue}const group={...n,members:[n]};result.push(group);if(key)index.set(key,group)}return result}
function category(type){const t=String(type||'').toLowerCase();if(/expense|approv|request/.test(t))return 'approvals';if(/financ|payment|invoice|receipt|collect/.test(t))return 'finance';if(/lesson|session|class|attendance/.test(t))return 'lessons';return 'other'}
async function load(){const size=Number($('size').value),filter=$('filter').value;
let q=db.from('notifications').select('id,title,message,target_path,created_at,read_at,event_type',{count:'exact'}).eq('recipient_id',uid).is('dismissed_at',null).order('created_at',{ascending:false}).range(page*size,(page+1)*size-1);
if(filter==='actions')q=q.in('event_type',actionTypes);
if(filter==='information')q=q.not('event_type','in','('+actionTypes.join(',')+')');
if(filter==='unread')q=q.is('read_at',null);
if(filter==='read')q=q.not('read_at','is',null);
if(['approvals','finance','lessons'].includes(filter)){const map={approvals:['expense_request','expense_approval','approval','expense'],finance:['payment','invoice','receipt','finance','collection'],lessons:['lesson','session','attendance']};q=q.or(map[filter].map(v=>'event_type.ilike.%'+v+'%').join(','))}
const{data,error,count}=await q;
if(error){$('results').textContent='تعذر تحميل الإشعارات: '+error.message;return}
rows=data||[];total=count||0;
if(page>0&&total<=page*size){page=Math.max(0,Math.ceil(total/size)-1);return load()}
const out=$('results');out.replaceChildren();out.className='';
for(const n of groupedRows(rows)){
const memberIds=n.members.map(x=>x.id);
const box=document.createElement('div');box.className='card'+(n.read_at?'':' unread');
const check=document.createElement('input');check.type='checkbox';check.className='select-notification';check.setAttribute('aria-label','تحديد إشعار: '+n.title);check.checked=memberIds.every(id=>selected.has(id));check.onchange=()=>{for(const id of memberIds){if(check.checked)selected.add(id);else selected.delete(id)}syncSelection()};
const detail=document.createElement('div');detail.className='card-body';const t=document.createElement('strong');t.textContent=(isAction(n)?'إجراء مطلوب · ':'')+n.title+(memberIds.length>1?' ('+memberIds.length+' إشعارات متشابهة)':'');const msg=document.createElement('p');msg.textContent=n.message;const time=document.createElement('small');time.textContent=safeDate(n.created_at);detail.append(t,msg,time);if(memberIds.length>1){const details=document.createElement('details');const summary=document.createElement('summary');summary.textContent='عرض توقيت كل إشعار ('+memberIds.length+')';details.append(summary);for(const item of n.members){const line=document.createElement('div');line.className='muted';line.textContent=safeDate(item.created_at);details.append(line)}detail.append(details)}
const actions=document.createElement('div');actions.className='actions';const open=document.createElement('button');open.textContent='فتح الوحدة';open.onclick=()=>{const route=(n.target_path||'dashboard.html').replace('.html','');try{parent.postMessage({type:'alkhubara:navigate',route},location.origin)}catch(e){}if(window===parent)location.href='./dashboard.html#'+route};actions.append(open);
if(!n.read_at){const mark=document.createElement('button');mark.className='secondary';mark.textContent='تعليم كمقروء';mark.onclick=async()=>{const{error}=await db.from('notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',uid).in('id',memberIds);if(error)alert(error.message);else{await load();changed()}};actions.append(mark)}
const remove=document.createElement('button');remove.type='button';remove.className='danger';remove.textContent='مسح';remove.setAttribute('aria-label','مسح إشعار: '+n.title);remove.onclick=()=>dismiss(memberIds,false);actions.append(remove);box.append(check,detail,actions);out.append(box)}
if(!rows.length){const empty=document.createElement('div');empty.className='state';empty.textContent='لا توجد إشعارات في هذا العرض';out.append(empty)}
$('counter').textContent=total+' إشعار';$('pages').textContent='صفحة '+(page+1)+' من '+Math.max(1,Math.ceil(total/size));$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=total;syncSelection()}
async function dismiss(ids,ask=true){
if(!ids.length)return;
if(ask&&!confirm('مسح '+ids.length+' إشعار من حسابك؟ لن تُحذف الأحداث أو العمليات الأصلية.'))return;
const now=new Date().toISOString();
const{error}=await db.from('notifications').update({dismissed_at:now,read_at:now}).eq('recipient_id',uid).in('id',ids);
if(error){alert('تعذر المسح: '+error.message);return}
ids.forEach(id=>selected.delete(id));await load();changed()}
$('clearRead').onclick=async()=>{
if(!confirm('مسح جميع الإشعارات المقروءة من حسابك؟'))return;
const now=new Date().toISOString();
const{error}=await db.from('notifications').update({dismissed_at:now}).eq('recipient_id',uid).is('dismissed_at',null).not('read_at','is',null);
if(error)alert('تعذر المسح: '+error.message);else{selected.clear();page=0;await load();changed()}
};
$('deleteSelected').onclick=()=>dismiss([...selected]);
$('selectPage').onchange=()=>{for(const n of rows){if($('selectPage').checked)selected.add(n.id);else selected.delete(n.id)}loadSelectionChecks()};
function loadSelectionChecks(){const groups=groupedRows(rows);document.querySelectorAll('.select-notification').forEach((box,i)=>{box.checked=(groups[i]?.members||[]).every(n=>selected.has(n.id))});syncSelection()}
$('all').onclick=async()=>{if(!confirm('تعليم جميع إشعاراتك كمقروءة؟'))return;const{error}=await db.from('notifications').update({read_at:new Date().toISOString()}).eq('recipient_id',uid).is('dismissed_at',null).is('read_at',null);if(error)alert(error.message);else{page=0;await load();changed()}};
$('next').onclick=()=>{page++;load()};$('prev').onclick=()=>{page=Math.max(0,page-1);load()};
$('refresh').onclick=load;$('size').onchange=$('filter').onchange=()=>{selected.clear();page=0;load()};
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}uid=user.id;await load()})();
</script></body></html>
