<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مركز الإشعارات | الخبراء</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f6;font-family:Cairo,Tahoma,Arial,sans-serif;color:#173a30}main{max-width:1120px;margin:auto;padding:20px}header{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}h1{font-size:22px;margin:0}h2{font-size:16px;margin:0}.muted{font-size:12px;color:#708578}.box{background:white;border-radius:14px;border:1px solid #dce9e0;padding:19px;margin-bottom:12px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;font-size:12px;border-radius:9px;padding:9px 13px;min-height:40px;cursor:pointer}button{background:#12684e;color:#fff;border:0;font-weight:700}button.secondary{background:#e7f2e9;color:#15523d}button:disabled{opacity:.5}.card{display:flex;align-items:center;justify-content:space-between;gap:13px;padding:14px 12px;border-bottom:1px solid #edf1ed}.card.unread{background:#f0faf3;border-right:3px solid #148159}.card strong{font-size:13px}.card p{font-size:12px;color:#536e5c;margin:4px 0}.card small{font-size:11px;color:#788c80}.actions{display:flex;gap:7px;flex-wrap:wrap}.pagination{display:flex;align-items:center;justify-content:space-between;margin-top:14px;gap:10px;flex-wrap:wrap}.state{padding:25px;text-align:center;color:#6d8575}@media(max-width:560px){main{padding:10px}.card{align-items:flex-start;flex-direction:column}.actions{width:100%}}
</style></head><body><main><header><div><h1>مركز الإشعارات</h1><div class="muted">الأحداث المرتبطة بصلاحيات حسابك فقط</div></div><div class="toolbar"><button class="secondary" id="all">تعليم الكل كمقروء</button><button class="secondary" id="refresh">تحديث</button></div></header><div class="box"><div class="toolbar"><label>عرض <select id="filter"><option value="all">الكل</option><option value="unread">غير المقروء</option></select></label><label>عدد الإشعارات <select id="size"><option value="10">10</option><option value="25">25</option><option value="50">50</option></select></label><span id="counter" class="muted"></span></div><div id="results" role="status" class="state">جارٍ تحميل الإشعارات…</div><div class="pagination"><button id="prev" class="secondary">السابق</button><span id="pages" class="muted"></span><button id="next" class="secondary">التالي</button></div></div></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co',"sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY"),$=id=>document.getElementById(id);
let page=0,rows=[],total=0;const safeDate=s=>new Intl.DateTimeFormat('ar-QA',{timeZone:'Asia/Qatar',dateStyle:'medium',timeStyle:'short'}).format(new Date(s));
async function load(){const size=Number($('size').value),q=db.from('notifications').select('id,title,message,target_path,created_at,read_at',{count:'exact'}).order('created_at',{ascending:false}).range(page*size,(page+1)*size-1);
if($('filter').value==='unread')q.is('read_at',null);const{data,error,count}=await q;if(error){$('results').textContent='تعذر تحميل الإشعارات: '+error.message;return}rows=data||[];total=count||0;const out=$('results');out.replaceChildren();out.className='';
for(const n of rows){const box=document.createElement('div');box.className='card'+(n.read_at?'':' unread');const detail=document.createElement('div');const t=document.createElement('strong');t.textContent=n.title;const msg=document.createElement('p');msg.textContent=n.message;const time=document.createElement('small');time.textContent=safeDate(n.created_at);detail.append(t,msg,time);const actions=document.createElement('div');actions.className='actions';const open=document.createElement('button');open.textContent='فتح الوحدة';open.onclick=()=>{const route=n.target_path.replace('.html','');try{parent.postMessage({type:'alkhubara:navigate',route},location.origin)}catch(e){};if(window===parent)location.href='./dashboard.html#'+route};actions.append(open);
if(!n.read_at){const mark=document.createElement('button');mark.className='secondary';mark.textContent='تعليم كمقروء';mark.onclick=async()=>{const{error}=await db.from('notifications').update({read_at:new Date().toISOString()}).eq('id',n.id);if(error)alert(error.message);else{load();parent.postMessage({type:'alkhubara:notifications-changed'},location.origin)}};actions.append(mark)}box.append(detail,actions);out.append(box)}
if(!rows.length){const empty=document.createElement('div');empty.className='state';empty.textContent='لا توجد إشعارات في هذا العرض';out.append(empty)}
$('counter').textContent=total+' إشعار';$('pages').textContent='صفحة '+(page+1)+' من '+Math.max(1,Math.ceil(total/size));$('prev').disabled=page===0;$('next').disabled=(page+1)*size>=total}
$('all').onclick=async()=>{if(!confirm('تعليم جميع إشعاراتك كمقروءة؟'))return;const{error}=await db.from('notifications').update({read_at:new Date().toISOString()}).is('read_at',null);if(error)alert(error.message);else{page=0;load();parent.postMessage({type:'alkhubara:notifications-changed'},location.origin)}};
$('next').onclick=()=>{page++;load()};$('prev').onclick=()=>{page=Math.max(0,page-1);load()};
$('refresh').onclick=load;$('size').onchange=$('filter').onchange=()=>{page=0;load()};
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}load()})();
</script></body></html>
