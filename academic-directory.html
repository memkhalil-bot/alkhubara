<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدليل الأكاديمي | الخبراء</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>body{font:14px Cairo,Tahoma,sans-serif;background:#f5f7f6;color:#163d32;margin:0}*{box-sizing:border-box}main{max-width:1080px;margin:auto;padding:25px}h1{font-size:23px}.panel{background:white;border:1px solid #dae8e0;padding:22px;border-radius:16px;margin:15px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:15px}label{display:block;font-weight:700;margin:6px 0}select,input,button{padding:11px;border-radius:9px;border:1px solid #ccdcd3;font:inherit;min-height:44px;width:100%}button{background:#116148;color:white;border:none;cursor:pointer}button:disabled{opacity:.5}p{color:#607768}.row{display:flex;gap:9px;align-items:end}.row input{flex:1}.row button{flex:0 0 150px}#links{display:flex;flex-wrap:wrap;gap:7px;margin:13px 0}.chip{background:#e8f4ec;border:1px solid #c6dacf;border-radius:20px;padding:7px 12px}#status{white-space:pre-line;color:#8a4432}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{flex-wrap:wrap}.row button{flex:auto}}</style></head><body><main><h1>الدليل الأكاديمي</h1><p>إدارة الجامعات والكليات والتخصصات وربط المواد بها. لا تُربط المواد بأي مدرس بشكل مسبق.</p><div class="panel"><div class="grid"><div><label>الجامعة</label><select id="university"><option value="">اختر الجامعة</option></select></div><div><label>الكلية</label><select id="college"><option value="">اختر الكلية</option></select></div><div><label>التخصص</label><select id="major"><option value="">اختر التخصص</option></select></div><div><label>المادة</label><select id="subject"><option value="">اختر مادة من الدليل</option></select></div></div><div id="links" aria-live="polite"></div><p style="font-size:12px;color:#607768">اختر التخصص ثم المادة واضغط ربط. المواد الموجودة مسبقاً لن تُحذف عند إضافة بيانات جديدة.</p><button id="link" disabled>ربط المادة بالتخصص</button></div><div class="panel"><h2>إضافة بيانات جديدة</h2><div class="grid"><div><label>النوع</label><select id="kind"><option value="university">جامعة</option><option value="college">كلية ضمن الجامعة المحددة</option><option value="major">تخصص ضمن الكلية المحددة</option><option value="subject">مادة دراسية</option></select></div><div><label>الاسم الجديد</label><input id="newName" maxlength="200" placeholder="اكتب الاسم"></div></div><div style="margin-top:15px"><button id="add">إضافة إلى الدليل</button></div></div><p id="status"></p><p><a href="./dashboard.html">العودة للنظام</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=x=>document.getElementById(x);let nodes=[],subjects=[],links=[];function choices(el,items,title){const old=el.value;el.replaceChildren(new Option(title,''));for(const x of items)el.add(new Option(x.name||x.subject_name,String(x.id)));if([...el.options].some(o=>o.value===old))el.value=old}function refresh(){choices($('university'),nodes.filter(n=>n.level==='university'),'اختر الجامعة');changeUniversity();choices($('subject'),subjects,'اختر المادة');renderLinks()}function changeUniversity(){choices($('college'),nodes.filter(n=>n.level==='college'&&String(n.parent_id)===$('university').value),'اختر الكلية');changeCollege()}function changeCollege(){choices($('major'),nodes.filter(n=>n.level==='major'&&String(n.parent_id)===$('college').value),'اختر التخصص');renderLinks()}function renderLinks(){const root=$('links');root.replaceChildren();$('link').disabled=!$('major').value||!$('subject').value;const major=$('major').value;for(const link of links.filter(x=>String(x.major_id)===major)){const subject=subjects.find(x=>x.id===link.subject_id);if(!subject)continue;const b=document.createElement('button');b.className='chip';b.style.width='auto';b.style.color='#164e3a';b.textContent=subject.subject_name+' ×';b.title='إزالة ارتباط المادة بهذا التخصص';b.onclick=async()=>{if(!confirm('إزالة ربط المادة بالتخصص؟'))return;const{error}=await db.from('academic_major_subjects').delete().eq('major_id',major).eq('subject_id',subject.id);if(error)show(error.message);else{show('تم تحديث ارتباط المادة');await load()}};root.append(b)}}function show(t){$('status').textContent=t}async function load(){const [n,s,l]=await Promise.all([db.from('academic_hierarchy').select('*').order('name'),db.from('academic_subjects').select('id,subject_name').order('subject_name'),db.from('academic_major_subjects').select('*')]);if(n.error||s.error||l.error){show((n.error||s.error||l.error).message);return}nodes=n.data||[];subjects=s.data||[];links=l.data||[];refresh()}$('university').onchange=changeUniversity;$('college').onchange=changeCollege;$('major').onchange=renderLinks;$('subject').onchange=renderLinks;$('link').onclick=async()=>{const major_id=Number($('major').value),subject_id=$('subject').value;if(!major_id||!subject_id)return;const{error}=await db.from('academic_major_subjects').upsert({major_id,subject_id},{onConflict:'major_id,subject_id'});if(error)show(error.message);else{show('تم ربط المادة بالتخصص');await load()}};$('add').onclick=async()=>{const name=$('newName').value.trim(),level=$('kind').value;if(name.length<2)return show('اكتب اسمًا صحيحًا');let error;if(level==='subject'){({error}=await db.rpc('create_academic_subject',{subject_name_input:name}))}else{const parent_id=level==='university'?null:Number($(level==='college'?'university':'college').value);if(level!=='university'&&!parent_id)return show('اختر الجامعة أو الكلية أولًا');if(nodes.some(x=>x.level===level&&x.name.trim().toLocaleLowerCase('ar')===name.toLocaleLowerCase('ar')&&x.parent_id===parent_id))return show('هذا الاسم موجود مسبقاً في نفس المستوى');({error}=await db.from('academic_hierarchy').insert({level,name,parent_id}))}if(error)show(error.message);else{$('newName').value='';show('تمت الإضافة إلى الدليل بنجاح. يمكن الآن اختيارها وربط المواد بالتخصص المناسب.');await load()}};(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}const{data:p}=await db.from('staff_profiles').select('role,is_active').eq('user_id',user.id).single();if(p?.role!=='super_admin'||!p.is_active){show('إدارة الدليل متاحة للسوبر أدمن فقط');document.querySelectorAll('button').forEach(b=>b.disabled=true);return}await load()})();</script></body></html>
