<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إذن صرف | مركز الخبراء التعليمي</title><link rel="stylesheet" href="./ux-unified.css"><style>
body{font-family:Cairo,Tahoma,Arial;background:#f3f5f3;color:#142f26;margin:0;padding:25px}.toolbar{max-width:820px;margin:0 auto 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}.toolbar button{background:#106047;color:white;border:0;border-radius:9px;padding:12px 22px;font:inherit;font-weight:800;cursor:pointer}.toolbar button:disabled{opacity:.5}
.paper{width:min(820px,100%);min-height:1030px;background:white;border:2px solid #183a2e;margin:auto;padding:38px 45px;box-sizing:border-box}header{text-align:center;border-bottom:2px solid #1d513d;padding-bottom:18px}header h1{margin:0 0 5px;font-size:25px}header h2{margin:8px 0 0;font-size:22px;color:#214a36}.codebox{display:grid;grid-template-columns:repeat(2,1fr);gap:15px;margin:25px auto;max-width:620px}.codebox>div,.amount{border:1px solid #c9d7cc;text-align:center;padding:10px 15px}.label{font-weight:650;color:#536d5d;font-size:13px}.value{display:block;font-size:18px;font-weight:800;margin-top:5px}.amount{max-width:360px;margin:20px auto;background:#f8fbf9}.details{border-top:1px solid #d7e3d9;border-bottom:1px solid #d7e3d9;padding:13px 0;margin:25px 0}.field{display:grid;grid-template-columns:145px 1fr;gap:20px;border-bottom:1px solid #e8eee9;padding:13px 3px;align-items:start}.field:last-child{border:0}.field strong{font-size:16px;font-weight:750;overflow-wrap:anywhere}.words{text-align:center;font-weight:800;font-size:16px;padding:16px;border-bottom:1px solid #d8e5db;line-height:2}.sign{display:grid;grid-template-columns:repeat(2,1fr);gap:60px;text-align:center;margin-top:105px}.sign>div{border-top:1px solid #273e30;padding-top:12px;font-weight:800}.footer{margin-top:85px;border-top:1px solid #e1eae3;padding-top:13px;font-size:12px;color:#5e7668;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.error{color:#b22929}.hide-print{display:block}
@media(max-width:600px){body{padding:9px}.paper{padding:19px 16px;min-height:820px}.field{grid-template-columns:1fr;gap:5px}.sign{gap:20px}.codebox{gap:8px}.footer{margin-top:55px}}
@page{size:A4 portrait;margin:10mm}
@media print{html,body{background:white!important;margin:0;padding:0}.paper{border:2px solid #111;width:100%;min-height:267mm;padding:18mm 14mm;box-shadow:none}.hide-print{display:none!important}.footer{margin-top:90px}.paper,.sign{break-inside:avoid}}
</style></head><body><div class="toolbar hide-print"><a href="./finance.html">العودة للإيرادات والمصروفات</a><button type="button" id="print" disabled>طباعة / حفظ PDF</button></div><main class="paper"><header><h1>مركز الخبراء التعليمي</h1><h2>إذن صرف</h2></header><section class="codebox"><div><span class="label">رقم الإذن</span><strong class="value" id="voucherNo">—</strong></div><div><span class="label">تاريخ الإذن / الصرف</span><strong class="value" id="voucherDate">—</strong></div></section><div class="amount"><span class="label">قيمة الإذن</span><strong class="value" id="voucherAmount">—</strong></div><div id="amountWords" class="words">—</div><section id="details" class="details"></section><section class="sign"><div>توقيع المحاسب</div><div>توقيع مدير المركز</div></section><footer class="footer"><span id="printedBy">طبع بواسطة: —</span><span id="printedAt">تاريخ ووقت الطباعة: —</span></footer><p id="status" role="status" class="hide-print">جارٍ التحقق من إذن الصرف...</p></main>
<script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
const methodLabels={cash:'كاش / نقدًا',card:'بطاقة',bank:'تحويل بنكي',cheque:'شيك',other:'أخرى'};
function writeField(label,value){const box=document.createElement('div');box.className='field';const title=document.createElement('span');title.className='label';title.textContent=label;const content=document.createElement('strong');content.textContent=value??'—';box.append(title,content);$('details').append(box)}
function arabicNumber(n){const ones=['','واحد','اثنان','ثلاثة','أربعة','خمسة','ستة','سبعة','ثمانية','تسعة','عشرة','أحد عشر','اثنا عشر','ثلاثة عشر','أربعة عشر','خمسة عشر','ستة عشر','سبعة عشر','ثمانية عشر','تسعة عشر'];const tens=['','','عشرون','ثلاثون','أربعون','خمسون','ستون','سبعون','ثمانون','تسعون'];const hundreds=['','مائة','مئتان','ثلاثمائة','أربعمائة','خمسمائة','ستمائة','سبعمائة','ثمانمائة','تسعمائة'];function belowThousand(x){let p=[];const h=Math.floor(x/100),v=x%100;if(h)p.push(hundreds[h]);if(v<20&&v)p.push(ones[v]);else if(v>=20){if(v%10)p.push(ones[v%10]);p.push(tens[Math.floor(v/10)])}return p.join(' و')}if(n===0)return'صفر';const scales=[['','',''],['ألف','ألفان','آلاف'],['مليون','مليونان','ملايين'],['مليار','ملياران','مليارات']];let parts=[],group=0;while(n&&group<4){const x=n%1000;if(x){let segment='';if(group===0)segment=belowThousand(x);else if(x===1)segment=scales[group][0];else if(x===2)segment=scales[group][1];else if(x>=3&&x<=10)segment=belowThousand(x)+' '+scales[group][2];else segment=belowThousand(x)+' '+scales[group][0];parts.unshift(segment)}n=Math.floor(n/1000);group++}return parts.join(' و')}
function amountInWords(amount){const dirhams=Math.round(Number(amount)*100);const major=Math.floor(dirhams/100),minor=dirhams%100;return 'فقط '+arabicNumber(major)+' ريال قطري'+(minor?' و'+arabicNumber(minor)+' درهم':'')+' لا غير'}
(async()=>{const{data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}const id=new URLSearchParams(location.search).get('id');if(!/^[a-f0-9-]{36}$/i.test(id||'')){$('status').textContent='رقم إذن غير صالح';return}
const{data:r,error}=await db.from('expense_requests').select('id,status,amount,category,description,payment_method,reference_number,beneficiary_name,voucher_number,paid_at,financial_entry_id').eq('id',id).single();if(error||r?.status!=='paid'||!r.financial_entry_id||!r.voucher_number){$('status').textContent='إذن الصرف غير متاح قبل الاعتماد وتأكيد الصرف';return}
const{data:entry,error:entryError}=await db.from('financial_entries').select('id,entry_date,amount,entry_type').eq('id',r.financial_entry_id).single();if(entryError||entry?.entry_type!=='expense'||Number(entry.amount)!==Number(r.amount)){$('status').textContent='تعذر مطابقة السند مع القيد المالي';return}
$('voucherNo').textContent=String(r.voucher_number).padStart(5,'0');$('voucherDate').textContent=entry.entry_date;$('voucherAmount').textContent=Number(r.amount).toLocaleString('ar-QA',{minimumFractionDigits:2,maximumFractionDigits:2})+' ر.ق';$('amountWords').textContent=amountInWords(r.amount);
writeField('اسم المستفيد',r.beneficiary_name||'غير محدد في الطلب القديم');writeField('بيان الصرف',r.description);writeField('نوع المصروفات',r.category);writeField('نوع الدفع',methodLabels[r.payment_method]||r.payment_method);writeField('رقم المرجع الخارجي',r.reference_number||'—');
$('status').textContent='تمت مطابقة إذن الصرف. للطباعة الرسمية اضغط طباعة / حفظ PDF.';$('print').disabled=false;
$('print').onclick=async()=>{const btn=$('print');btn.disabled=true;const{data,error:logError}=await db.rpc('print_expense_voucher',{p_request_id:r.id});if(logError){$('status').textContent='تعذر تسجيل الطباعة: '+logError.message;btn.disabled=false;return}
$('printedBy').textContent='طبع بواسطة: '+data.printed_by;$('printedAt').textContent='تاريخ ووقت الطباعة: '+new Date(data.printed_at).toLocaleString('ar-QA',{timeZone:'Asia/Qatar',dateStyle:'short',timeStyle:'medium'});$('status').textContent='تم توثيق عملية الطباعة';btn.disabled=false;window.print()};
})()
</script></body></html>
