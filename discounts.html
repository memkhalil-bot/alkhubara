<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>طلبات خصم الحصص | الخبراء</title><link rel="stylesheet" href="./ux-unified.css"><style>body{font-family:Cairo,Tahoma,Arial,sans-serif;background:#f5f7f6;color:#193d32;margin:0}main{max-width:1080px;margin:auto;padding:20px}.panel{background:white;border:1px solid #dfe8e2;border-radius:13px;padding:20px;margin:12px 0}h1{font-size:22px}h2{font-size:17px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}label{display:block;font-size:13px;font-weight:700;margin:8px 0 4px}input,select,textarea{font:inherit;box-sizing:border-box;width:100%;padding:10px;border:1px solid #c9d9d0;border-radius:9px;background:white}button{font:inherit;border:0;border-radius:8px;background:#12684e;color:white;padding:10px 15px;cursor:pointer}button.secondary{background:#e6f2eb;color:#17553f}button:disabled{opacity:.5}.record{padding:15px 0;border-bottom:1px solid #edf2ef}.record:last-child{border:0}.muted{color:#6b8175;font-size:12px}.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}.badge{display:inline-block;padding:3px 9px;background:#f4eee2;border-radius:99px;font-size:12px}.price{font-weight:700;color:#12684e}#message{min-height:22px}summary{cursor:pointer}@media(max-width:600px){.grid{grid-template-columns:1fr}main{padding:10px}}</style></head><body><main><h1>خصومات الحصص — طلب واعتماد</h1><p class="muted">الخصم يسري على كل طالب في الحصة الفردية أو الجماعية. السعر الأصلي يظل محفوظًا، والخصم المعتمد فقط يؤثر على صافي الفاتورة.</p><section class="panel" id="requestBox"><h2>طلب خصم</h2><div class="grid"><div><label for="lesson">الحصة</label><select id="lesson"><option value="">جارٍ التحميل...</option></select></div><div><label for="percent">نسبة الخصم (%)</label><input id="percent" type="number" min="0.01" max="99" step="0.01" placeholder="مثال: 10"></div></div><label for="reason">سبب طلب الخصم (إجباري)</label><textarea id="reason" rows="3" maxlength="1000" placeholder="اكتب سبب الخصم للمدير"></textarea><p class="muted" id="preview">اختر حصة ونسبة لرؤية القيمة بعد الخصم لكل طالب.</p><button id="request">إرسال الطلب للإدارة</button></section><section class="panel"><h2>طلبات الخصم</h2><div class="actions"><button class="secondary" id="refresh">تحديث</button><select id="filter" style="max-width:260px"><option value="all">جميع الطلبات</option><option value="pending">بانتظار الاعتماد</option><option value="approved">معتمدة</option><option value="rejected">مرفوضة</option></select></div><div id="results">جارٍ التحميل...</div></section><p role="status" id="message"></p></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
let admin=false,lessons=[],requests=[],approvers=new Map(),uid='';
const money=n=>Number(n||0).toLocaleString('ar-QA',{minimumFractionDigits:2,maximumFractionDigits:2});
function message(t){$('message').textContent=t}
function statusText(s){return ({pending:'بانتظار الاعتماد',approved:'معتمد',rejected:'مرفوض'})[s]||s}
function human(d){return d?new Intl.DateTimeFormat('ar-QA',{timeZone:'Asia/Qatar',dateStyle:'medium',timeStyle:'short'}).format(new Date(d)):'—'}
function preview(){const l=lessons.find(x=>x.id===$('lesson').value),p=Number($('percent').value);$('preview').textContent=l&&p>0&&p<=99?'الأصل لكل طالب: '+money(l.lesson_total_price)+' ر.ق · بعد خصم '+p+'%: '+money(Math.round(Number(l.lesson_total_price)*(100-p))/100)+' ر.ق':'اختر حصة ونسبة لرؤية قيمة الحصة لكل طالب'}
$('lesson').onchange=$('percent').oninput=preview;
async function load(){
 const [lResult,rResult]=await Promise.all([
 db.from('lessons').select('id,teacher_id,lesson_date,subject,lesson_mode,lesson_total_price,status,is_archived').eq('is_archived',false).neq('status','cancelled').order('lesson_date',{ascending:false}).limit(500),
 db.from('lesson_discount_requests').select('id,lesson_id,discount_percent,reason,status,requested_at,requested_by,reviewed_at,reviewed_by,review_note').order('requested_at',{ascending:false}).limit(500)
 ]);
 if(lResult.error||rResult.error){message('تعذر تحميل خصومات الحصص: '+(lResult.error||rResult.error).message);return}
 lessons=lResult.data||[];requests=rResult.data||[];
 const active=new Set(requests.filter(x=>x.status==='pending'||x.status==='approved').map(x=>x.lesson_id));
 $('lesson').replaceChildren(new Option('اختر الحصة',''));
 for(const l of lessons.filter(x=>!active.has(x.id))){const suffix=l.lesson_mode==='group'?' — جماعية':' — فردية';$('lesson').add(new Option(l.lesson_date+' · '+l.subject+suffix+' · '+money(l.lesson_total_price)+' ر.ق',l.id))}
 if(admin){const {data}=await db.from('staff_profiles').select('user_id,full_name').eq('is_active',true).limit(500);approvers=new Map((data||[]).map(p=>[p.user_id,p.full_name]))}
 const filter=$('filter').value,out=$('results');out.replaceChildren();
 for(const r of requests.filter(x=>filter==='all'||filter===x.status)){
 const l=lessons.find(x=>x.id===r.lesson_id),card=document.createElement('div');card.className='record';
 const heading=document.createElement('strong');heading.textContent=(l?l.subject+' · '+l.lesson_date:'حصة')+' · '+statusText(r.status)+' · '+r.discount_percent+'%';card.append(heading);
 const more=document.createElement('p');more.className='muted';more.textContent='الطلب: '+human(r.requested_at)+' · '+(l?.lesson_mode==='group'?'جماعية':'فردية')+' · '+r.reason;card.append(more);
 if(l?.lesson_total_price!=null){const price=document.createElement('p');price.className='price';const original=Number(l.lesson_total_price),net=Math.round(original*(100-Number(r.discount_percent)))/100;price.textContent='لكل طالب: '+money(original)+' ر.ق ← '+money(net)+' ر.ق بعد الخصم';card.append(price)}
 if(r.reviewed_at){const approval=document.createElement('p');approval.className='muted';approval.textContent='القرار: '+human(r.reviewed_at)+' · المعتمد: '+(approvers.get(r.reviewed_by)||'حساب الإدارة')+(r.review_note?' · '+r.review_note:'');card.append(approval)}
 if(admin&&r.status==='pending'){const note=document.createElement('textarea');note.placeholder='ملاحظات الموافقة أو سبب الرفض';note.rows=2;card.append(note);const actions=document.createElement('div');actions.className='actions';for(const [approve,label] of [[true,'اعتماد الخصم'],[false,'رفض الخصم']]){const btn=document.createElement('button');btn.textContent=label;if(!approve)btn.className='secondary';btn.onclick=async()=>{if(!approve&&!note.value.trim()){message('اكتب سبب الرفض');return}if(!confirm((approve?'اعتماد':'رفض')+' خصم '+r.discount_percent+'% لهذه الحصة؟'))return;btn.disabled=true;const {data,error}=await db.rpc('review_lesson_discount',{p_request:r.id,p_approve:approve,p_note:note.value.trim()||null});btn.disabled=false;if(error)message('تعذّر تسجيل القرار: '+error.message);else{message('تم تسجيل القرار. الفواتير المتأثرة: '+(data?.affected_invoices||0));await load()}};actions.append(btn)}card.append(actions)}
 out.append(card)
 }
 if(!out.childElementCount){const p=document.createElement('p');p.className='muted';p.textContent='لا توجد طلبات مطابقة';out.append(p)}
 preview()
}
$('request').onclick=async()=>{const lesson=$('lesson').value,percent=Number($('percent').value),reason=$('reason').value.trim();if(!lesson||!Number.isFinite(percent)||percent<=0||percent>99||reason.length<5){message('اختر حصة ونسبة من 0.01 إلى 99، واكتب سببًا لا يقل عن 5 أحرف');return}const btn=$('request');btn.disabled=true;const {error}=await db.rpc('request_lesson_discount',{p_lesson_id:lesson,p_percent:percent,p_reason:reason});btn.disabled=false;if(error)message('تعذر إرسال الطلب: '+error.message);else{message('تم إرسال طلب الخصم إلى الإدارة');$('reason').value='';$('percent').value='';await load()}};
$('refresh').onclick=load;$('filter').onchange=load;
(async()=>{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('./login.html');return}uid=user.id;const {data:p}=await db.from('staff_profiles').select('role,is_active,deleted_at').eq('user_id',uid).maybeSingle();if(!p?.is_active||p.deleted_at){message('الحساب غير نشط');return}admin=['super_admin','admin'].includes(p.role);await load()})();
</script></body></html>
