<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>كشوف الحساب | الخبراء</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#183c32;font:14px Tahoma,Arial}main{max-width:1180px;margin:auto;padding:22px}.panel{background:#fff;border:1px solid #dae7df;border-radius:12px;padding:20px;margin:14px 0}h1{font-size:23px}label{display:block;font-weight:bold;margin-bottom:7px}.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}select,input,button{padding:11px;width:100%;border:1px solid #cdded4;border-radius:9px;background:#fff;font:inherit}button{background:#11614b;color:white;border:0;cursor:pointer}.actions{display:flex;gap:9px;margin:15px 0}.actions button{width:auto}table{border-collapse:collapse;width:100%;min-width:680px}th,td{text-align:right;border-bottom:1px solid #dfe8e2;padding:10px}th{background:#edf5ee}.scroll{overflow:auto}.muted{color:#617468;font-size:12px}#printHead{display:none}@media(max-width:700px){.filters{grid-template-columns:repeat(2,1fr)}}@media print{@page{size:A4 landscape;margin:12mm}body{background:white}.filters,.actions,.nav{display:none}#printHead{display:block}.panel{border:0;padding:5px}.scroll{overflow:visible}table{min-width:0}thead{display:table-header-group}tr{break-inside:avoid}}</style></head><body><main><h1>كشوف الحساب</h1><p class="muted">الكشوف تعرض الفواتير والتحصيلات ومستحقات المدرسين من السجلات الفعلية. لا تنشئ قيوداً مالية جديدة.</p><div class="panel"><div class="filters"><div><label>نوع الحساب</label><select id="kind"><option value="student">طالب</option><option value="teacher">مدرس</option></select></div><div><label>اسم الحساب</label><select id="person"></select></div><div><label>من تاريخ</label><input id="from" type="date"></div><div><label>إلى تاريخ</label><input id="to" type="date"></div></div><div class="actions"><button id="view">عرض كشف الحساب</button><button id="print">طباعة</button><button id="csv">تصدير CSV</button></div><p id="message" class="muted" role="status"></p></div><div class="panel"><div id="printHead"><img src="./alkhubara-wordmark.svg" alt="الخبراء" style="height:56px;background:#143b35;padding:6px"><h2>مركز الخبراء التعليمي</h2><p id="printedAt"></p></div><h2 id="heading">كشف الحساب</h2><p id="summary" class="muted"></p><div class="scroll"><table><thead><tr><th>التاريخ</th><th>العملية</th><th>مدين (ر.ق)</th><th>دائن (ر.ق)</th><th>الرصيد (ر.ق)</th></tr></thead><tbody id="rows"></tbody></table></div></div><p class="nav"><a href="./dashboard.html">العودة إلى لوحة التحكم</a></p></main><script type="module">import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=x=>document.getElementById(x);let students=[],teachers=[],entries=[],current=[],printedBy='';const msg=t=>$('message').textContent=t;const money=n=>Number(n||0).toLocaleString('en-QA',{minimumFractionDigits:2,maximumFractionDigits:2});function setPeople(){const items=$('kind').value==='student'?students:teachers;$('person').replaceChildren(new Option('اختر الحساب',''));for(const x of items)$('person').add(new Option((x.student_code||x.teacher_code||'')+' — '+x.full_name,x.id))}function dated(d){if(!d)return '';const value=String(d);if(/^\d{4}-\d{2}-\d{2}$/.test(value))return value;const date=new Date(value);return Number.isNaN(date.getTime())?'':new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Qatar',year:'numeric',month:'2-digit',day:'2-digit'}).format(date)}async function fetchAll(table,columns){const out=[],pageSize=500;for(let offset=0;;offset+=pageSize){const{data,error}=await db.from(table).select(columns).order('id',{ascending:true}).range(offset,offset+pageSize-1);if(error)throw error;out.push(...(data||[]));if(!data||data.length<pageSize)break}return out}function printable(){const now=new Date();$('printedAt').textContent='تاريخ ووقت الطباعة: '+new Intl.DateTimeFormat('ar-QA',{dateStyle:'medium',timeStyle:'short',timeZone:'Asia/Qatar'}).format(now)+' | المستخدم: '+printedBy}function render(){const id=$('person').value;if(!id){msg('اختر الحساب أولاً');return}const name=$('person').selectedOptions[0].textContent;const from=$('from').value||'0000-01-01',to=$('to').value||'9999-12-31';if(from>to){msg('تاريخ البداية بعد تاريخ النهاية');return}const source=entries.filter(x=>x.person===id).sort((a,b)=>a.date.localeCompare(b.date)||a.label.localeCompare(b.label));let opening=0,balance=0;current=[];for(const x of source){const delta=x.debit-x.credit;if(x.date<from)opening+=delta;else if(x.date<=to){balance+=delta;current.push({...x,balance:opening+balance})}}$('heading').textContent='كشف حساب '+($('kind').value==='student'?'الطالب':'المدرس')+' — '+name;const debit=current.reduce((n,x)=>n+x.debit,0),credit=current.reduce((n,x)=>n+x.credit,0);$('summary').textContent='الرصيد الافتتاحي: '+money(opening)+' | إجمالي المدين: '+money(debit)+' | إجمالي الدائن: '+money(credit)+' | الرصيد الختامي: '+money(opening+balance)+' ر.ق';$('rows').replaceChildren();for(const x of current){const tr=document.createElement('tr');for(const v of [x.date,x.label,money(x.debit),money(x.credit),money(x.balance)]){const td=document.createElement('td');td.textContent=v;tr.append(td)}$('rows').append(tr)}msg(current.length+' حركة خلال الفترة المحددة');printable()}async function loadStatement(){entries=[];current=[];const kind=$('kind').value;msg('جاري إعداد كشف الحساب...');try{if(kind==='student'){const [invoices,allocs,receipts]=await Promise.all([fetchAll('invoices','id,student_id,lesson_id,service_id,amount,issued_at,invoice_no'),fetchAll('receipt_allocations','invoice_id,receipt_id,amount'),fetchAll('financial_entries','id,entry_date,entry_type,student_id,amount,description,reverses_entry_id')]);const invMap=new Map(invoices.map(x=>[x.id,x]));for(const x of invoices)entries.push({person:x.student_id,date:dated(x.issued_at),debit:Number(x.amount),credit:0,label:'فاتورة '+x.invoice_no});const revIds=new Set(receipts.filter(x=>x.entry_type==='reversal').map(x=>x.reverses_entry_id));const receiptsById=new Map(receipts.filter(x=>x.entry_type==='receipt'&&!revIds.has(x.id)).map(x=>[x.id,x]));for(const a of allocs){const inv=invMap.get(a.invoice_id),receipt=receiptsById.get(a.receipt_id);if(inv&&receipt)entries.push({person:inv.student_id,date:dated(receipt.entry_date),debit:0,credit:Number(a.amount),label:'تحصيل على فاتورة '+inv.invoice_no})}for(const x of receipts.filter(x=>x.entry_type==='receipt'&&!revIds.has(x.id))){const allocated=allocs.filter(a=>a.receipt_id===x.id).reduce((n,a)=>n+Number(a.amount),0);const remainder=Number(x.amount)-allocated;if(remainder>0)entries.push({person:x.student_id,date:dated(x.entry_date),debit:0,credit:remainder,label:'تحصيل غير مخصص لفاتورة'})}}else{const [lessons,rates,paid]=await Promise.all([fetchAll('lessons','id,teacher_id,lesson_date,hours,status,is_archived'),fetchAll('lesson_rates','lesson_id,teacher_hourly_rate'),fetchAll('financial_entries','entry_date,entry_type,teacher_id,amount,reverses_entry_id,id')]);const rateMap=new Map(rates.map(x=>[x.lesson_id,x]));for(const l of lessons){if(l.status!=='completed'||l.is_archived)continue;const rate=rateMap.get(l.id);if(rate&&Number(rate.teacher_hourly_rate)>0)entries.push({person:l.teacher_id,date:l.lesson_date,debit:Number(l.hours)*Number(rate.teacher_hourly_rate),credit:0,label:'مستحق حصة مكتملة'})}const reversed=new Set(paid.filter(x=>x.entry_type==='reversal').map(x=>x.reverses_entry_id));for(const x of paid.filter(x=>x.entry_type==='teacher_payment'&&!reversed.has(x.id)))entries.push({person:x.teacher_id,date:x.entry_date,debit:0,credit:Number(x.amount),label:'صرف مستحقات مدرس'})}render()}catch(e){msg('تعذر إعداد التقرير: '+e.message)}}$('kind').onchange=()=>{setPeople();entries=[];$('rows').replaceChildren();$('summary').textContent='';msg('اختر الحساب والفترة')};$('view').onclick=loadStatement;$('print').onclick=()=>{if(!$('person').value)return msg('اختر الحساب');printable();window.print()};$('csv').onclick=()=>{if(!$('person').value)return;const rows=[['التاريخ','العملية','مدين','دائن','الرصيد'],...current.map(x=>[x.date,x.label,x.debit,x.credit,x.balance])];const csv='\ufeff'+rows.map(row=>row.map(v=>{const raw=String(v??''),safe=/^\s*[=+@-]/u.test(raw)?"'"+raw:raw;return '"'+safe.replaceAll('"','""')+'"'}).join(',')).join('\r\n');const link=document.createElement('a');link.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));link.download='account-statement.csv';link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)};(async()=>{try{const {data:{user}}=await db.auth.getUser();if(!user)throw Error('login');const {data:profile,error}=await db.from('staff_profiles').select('role,full_name,is_active').eq('user_id',user.id).single();if(error||!profile?.is_active)throw Error('ليس لديك صلاحية');const {data:perms,error:pe}=await db.from('user_permissions').select('permission');if(pe)throw pe;const grants=new Set((perms||[]).map(x=>x.permission));if(profile.role!=='super_admin'&&!grants.has('finance.view')&&!grants.has('finance.edit'))throw Error('هذا التقرير متاح للمستخدمين الماليين فقط');printedBy=profile.full_name||user.email;[students,teachers]=await Promise.all([fetchAll('students','id,full_name,student_code'),fetchAll('teachers','id,full_name,teacher_code')]);setPeople();msg('اختر طالباً أو مدرساً وحدد الفترة')}catch(e){msg('لا يمكن تحميل الكشف: '+e.message);document.querySelectorAll('button').forEach(b=>b.disabled=true)}})();</script></body></html>
