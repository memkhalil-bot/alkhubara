<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المجموعات الدراسية</title><style>body{font-family:Tahoma,Arial;background:#f5f7f6;color:#143b31;margin:0}main{max-width:1100px;margin:auto;padding:24px}.panel{background:white;border:1px solid #dbe8df;border-radius:14px;margin:14px 0;padding:20px}h1{font-size:23px}label{display:block;margin:11px 0 5px;font-weight:bold}select,input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #d3dfd5;min-height:42px}select,input{width:100%;box-sizing:border-box}button{background:#12604d;color:white;border:0;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.group{border-bottom:1px solid #e3e9e4;padding:14px 0}.muted{color:#637b6d;font-size:13px}.error{color:#a12323}#students{height:180px}@media(max-width:630px){.grid{grid-template-columns:1fr}}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><h1>المجموعات الدراسية</h1><p class="muted">يمكن حفظ المجموعة كمسودة؛ تتطلب المجموعة النشطة من طالبين إلى 10 طلاب.</p><section id="editor" class="panel" hidden><h2>إضافة مجموعة</h2><form id="groupForm"><div class="grid"><div><label>اسم المجموعة</label><input id="name" minlength="2" maxlength="120" required></div><div><label>المدرس</label><select id="teacher" required></select></div><div><label>المادة</label><select id="subject" required></select></div><div><label>الطلاب (اختيار متعدد)</label><select multiple id="students" required></select></div></div><p id="selection" class="muted"></p><button type="submit" id="save">حفظ المجموعة</button></form></section><section class="panel"><h2>قائمة المجموعات</h2><div id="rows" class="muted">جارٍ التحميل...</div></section><p id="status" role="status"></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=x=>document.getElementById(x);
let students=[],teachers=[],subjects=[],canEdit=false;
function options(node,items,label){node.replaceChildren();for(const x of items){const opt=document.createElement('option');opt.value=x.id;opt.textContent=x[label];node.append(opt)}}
const selected=()=>[...$('students').selectedOptions].map(x=>x.value);
$('students').addEventListener('change',()=>$('selection').textContent='عدد الطلاب المختارين: '+selected().length+' (2 إلى 10 للتفعيل)');
async function load(){const [g,m]=await Promise.all([db.from('study_groups').select('id,name,status,teacher_id,subject_id').order('created_at',{ascending:false}),db.from('study_group_members').select('group_id,student_id')]);if(g.error||m.error){$('rows').textContent='تعذر تحميل المجموعات';return}
$('rows').replaceChildren();for(const x of g.data){const line=document.createElement('div');line.className='group';const title=document.createElement('b');title.textContent=x.name;const count=m.data.filter(a=>a.group_id===x.id).length;const info=document.createElement('p');info.className='muted';info.textContent='المدرس: '+(teachers.find(t=>t.id===x.teacher_id)?.full_name||'—')+' · عدد الطلاب: '+count+' · الحالة: '+(x.status==='active'?'نشطة':'مسودة / مؤرشفة');line.append(title,info);
if(canEdit&&x.status==='draft'&&count>=2){const btn=document.createElement('button');btn.textContent='تفعيل المجموعة';btn.onclick=async()=>{btn.disabled=true;const{error}=await db.from('study_groups').update({status:'active'}).eq('id',x.id);$('status').textContent=error?error.message:'تم تفعيل المجموعة';load()};line.append(btn)}$('rows').append(line)}if(!g.data.length)$('rows').textContent='لا توجد مجموعات بعد'}
$('groupForm').onsubmit=async e=>{e.preventDefault();const ids=selected();if(ids.length>10||ids.length<1){$('status').textContent='اختر من طالب إلى 10 طلاب؛ التفعيل يبدأ من طالبين';return}const submit=$('save');submit.disabled=true;
const{data:g,error}=await db.from('study_groups').insert({name:$('name').value.trim(),teacher_id:$('teacher').value,subject_id:$('subject').value,created_by:(await db.auth.getUser()).data.user.id}).select('id').single();
if(error){$('status').textContent=error.message;submit.disabled=false;return}
const inserted=await db.from('study_group_members').insert(ids.map(student_id=>({group_id:g.id,student_id})));
$('status').textContent=inserted.error?'المجموعة محفوظة كمسودة لكن إضافة الطلاب فشلت: '+inserted.error.message:'تم إنشاء المجموعة كمسودة. يمكن تفعيلها عند اكتمال طالبين.';submit.disabled=false;if(!inserted.error){$('groupForm').reset();load()}};
(async()=>{const {data:{user}}=await db.auth.getUser();if(!user){location.replace('login.html');return}const[prof,grants]=await Promise.all([db.from('staff_profiles').select('role,is_active').eq('user_id',user.id).single(),db.from('user_permissions').select('permission')]);if(prof.error||!prof.data.is_active){location.replace('login.html');return}
const rights=new Set((grants.data||[]).map(x=>x.permission));canEdit=prof.data.role==='super_admin'||rights.has('groups.edit');if(!canEdit&&prof.data.role!=='super_admin'&&!rights.has('groups.view')){document.querySelector('main').textContent='غير مصرح';return}
$('editor').hidden=!canEdit;const {data:refs,error:refsError}=await db.rpc('group_reference_data');if(refsError){$('status').textContent='تعذر تحميل البيانات المرجعية: '+refsError.message;return}students=refs.students||[];teachers=refs.teachers||[];subjects=refs.subjects||[];options($('students'),students,'full_name');options($('teacher'),teachers,'full_name');options($('subject'),subjects,'subject_name');load()})()
</script></body></html>
