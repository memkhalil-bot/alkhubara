<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>استعادة كلمة المرور | مركز الخبراء التعليمي</title><style>body{margin:0;background:#f5f7f6;font-family:Tahoma,Arial,sans-serif;color:#15372e;min-height:100dvh;display:grid;place-items:center;padding:18px}main{background:white;max-width:440px;width:100%;border:1px solid #dfebe3;border-radius:17px;padding:28px;box-sizing:border-box;box-shadow:0 12px 40px #14362c14}h1{font-size:23px;margin-top:0}p{line-height:1.9;color:#5d7169}label{display:block;font-weight:700;margin:18px 0 7px}input{width:100%;min-height:46px;border:1px solid #bccfc4;border-radius:9px;padding:10px;box-sizing:border-box;direction:ltr;font:inherit;font-size:16px}button{width:100%;min-height:46px;background:#146149;border:0;border-radius:9px;color:white;font:inherit;font-weight:bold;margin-top:20px;cursor:pointer}button:disabled{opacity:.5}a{color:#146149}#message{margin:12px 0;line-height:1.8}form[hidden]{display:none}.password-wrap{position:relative;margin-top:7px}.password-wrap input{margin:0;padding-inline-end:52px}.eye-toggle{position:absolute;inset-inline-end:5px;top:50%;transform:translateY(-50%);width:38px;min-height:38px;height:38px;margin:0;padding:7px;background:transparent;color:#386a58;border:0;border-radius:8px;display:grid;place-items:center}.eye-toggle:hover,.eye-toggle:focus-visible{background:#eaf4ef;outline:2px solid #b4d8c6}.eye-toggle svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.password-wrap{direction:ltr!important}.password-wrap input{padding-right:53px!important;padding-left:13px!important}.password-wrap .eye-toggle{right:7px!important;left:auto!important;inset-inline-end:auto!important;inset-inline-start:auto!important;top:50%!important;transform:translateY(-50%)!important;display:grid!important;align-items:center!important;justify-items:center!important}</style><link rel="stylesheet" href="./ux-unified.css"></head><body><main><h1>تعيين كلمة مرور جديدة</h1><p id="intro">جارٍ التحقق من رابط استعادة كلمة المرور...</p><form id="reset" hidden><label for="password">كلمة المرور الجديدة</label><div class="password-wrap"><input id="password" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button class="eye-toggle" type="button" data-toggle="password" aria-label="إظهار كلمة المرور" aria-pressed="false" title="إظهار كلمة المرور"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></div><label for="confirmation">تأكيد كلمة المرور</label><div class="password-wrap"><input id="confirmation" type="password" autocomplete="new-password" minlength="6" maxlength="128" required><button class="eye-toggle" type="button" data-toggle="confirmation" aria-label="إظهار كلمة المرور" aria-pressed="false" title="إظهار كلمة المرور"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/><path class="eye-slash" d="M3 3l18 18"/></svg></button></div><button id="save" type="submit">تحديث كلمة المرور</button></form><div id="message" role="status"></div><p><a href="./login.html">العودة لتسجيل الدخول</a></p></main><script type="module">
import {createClient} from 'https://esm.sh/@supabase/supabase-js@2.57.0';
const client=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);
let recoveryVerified=false;
document.querySelectorAll('.eye-toggle').forEach(btn=>{const field=document.getElementById(btn.dataset.toggle);const slash=btn.querySelector('.eye-slash');const render=()=>{const visible=field.type==='text';slash.style.display=visible?'none':'';btn.setAttribute('aria-label',visible?'إخفاء كلمة المرور':'إظهار كلمة المرور');btn.setAttribute('title',visible?'إخفاء كلمة المرور':'إظهار كلمة المرور');btn.setAttribute('aria-pressed',String(visible))};btn.addEventListener('click',()=>{field.type=field.type==='password'?'text':'password';render();field.focus()});render()});
function showError(){ $('intro').textContent='الرابط غير صالح أو منتهي الصلاحية. ارجع لصفحة تسجيل الدخول واطلب رابط استعادة جديد.';$('reset').hidden=true}
async function ready(){
 const query=new URLSearchParams(location.search),tokenHash=query.get('token_hash'),type=query.get('type');
 if(tokenHash&&type==='recovery'){
  const {error}=await client.auth.verifyOtp({token_hash:tokenHash,type:'recovery'});
  if(error){showError();return}
  recoveryVerified=true;
 }else{
  const fragment=new URLSearchParams(location.hash.slice(1));
  if(fragment.get('error')||fragment.get('error_code')){showError();return}
  // Supabase recovery links may arrive with an access token in URL fragment.
  if(fragment.get('access_token')&&fragment.get('refresh_token')&&fragment.get('type')==='recovery'){
   const {error}=await client.auth.setSession({access_token:fragment.get('access_token'),refresh_token:fragment.get('refresh_token')});
   if(error){showError();return}
   recoveryVerified=true;
  }
 }
 if(!recoveryVerified){showError();return}
 const {data:{user},error}=await client.auth.getUser();
 if(error||!user){showError();return}
 const profile=await client.from('staff_profiles').select('is_active,deleted_at').eq('user_id',user.id).single();
 if(profile.error||!profile.data?.is_active||profile.data?.deleted_at){await client.auth.signOut();$('intro').textContent='الحساب غير نشط. تواصل مع مدير النظام.';return}
 $('intro').textContent='الرابط صالح. اكتب كلمة مرور جديدة من 6 أحرف على الأقل.';$('reset').hidden=false;
 history.replaceState(null,'','reset-password.html');
}
$('reset').addEventListener('submit',async e=>{e.preventDefault();if(!recoveryVerified)return;const pass=$('password').value;if(pass.length<6||pass!==$('confirmation').value){$('message').textContent='تأكد من تطابق الكلمتين وطول كلمة المرور (6 أحرف على الأقل).';return}
$('save').disabled=true;const {error}=await client.auth.updateUser({password:pass});if(error){$('message').textContent='تعذر تحديث كلمة المرور: '+error.message;$('save').disabled=false;return}
$('reset').hidden=true;$('intro').textContent='تم تغيير كلمة المرور بنجاح. يمكنك الآن تسجيل الدخول بكلمة المرور الجديدة.';$('message').textContent='سيتم إنهاء جلسة الاستعادة للأمان.';await client.auth.signOut()});
ready();
</script><script src="./ux-forms.js" defer></script></body></html>
