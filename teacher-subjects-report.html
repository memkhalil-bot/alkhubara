<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تقرير المواد حسب المدرس | مركز الخبراء التعليمي</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><style>*{box-sizing:border-box}body{margin:0;background:#f5f7f6;color:#183a30;font:14px Cairo,Tahoma,sans-serif}header{padding:16px 22px;background:#123b38;color:white;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}header h1{font-size:21px;margin:0}header a{color:white}main{max-width:1150px;margin:24px auto;padding:0 15px}.panel{background:white;border:1px solid #dce9df;border-radius:15px;padding:20px}.toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:15px 0}input,select,button{font:inherit;border-radius:9px;min-height:41px;padding:8px 12px}input,select{border:1px solid #c7dacf;background:white}input{flex:1;min-width:170px}button{background:#12604d;color:white;border:0;cursor:pointer}button.secondary{background:#e9f3ed;color:#164c3b}.hint{color:#647b70;font-size:12px;line-height:1.8}table{width:100%;border-collapse:collapse}th,td{padding:13px 10px;text-align:right;border-bottom:1px solid #e6eee9}th{background:#eaf3ed;white-space:nowrap}tbody tr:nth-child(even){background:#f9fbf9}.tablewrap{overflow-x:auto}.muted{color:#72877b}#status{margin:14px 0;color:#a0302b}@media print{header,.toolbar{display:none}body{background:white}.panel{border:0}main{margin:0;max-width:none}}@media(max-width:600px){main{padding:0 8px}.panel{padding:12px}table{font-size:12px}}</style></head><body><header><h1>تقرير المواد حسب المدرس</h1><a href="./dashboard.html">العودة للنظام</a></header><main><section class="panel"><p class="hint">يعرض المواد المرتبطة بكل مدرس في ملفه، بدون الحصص أو الساعات أو الحسابات المالية. المادة الواحدة يمكن أن ترتبط بأكثر من مدرس.</p><div class="toolbar"><input id="search" type="search" placeholder="بحث باسم المدرس أو الكود أو المادة" aria-label="البحث"><select id="subjectFilter" aria-label="تصفية حسب المادة"><option value="">جميع المواد</option></select><button id="export">تصدير Excel</button><button class="secondary" onclick="window.print()">طباعة</button></div><p class="hint" id="summary"></p><div class="tablewrap"><table><thead><tr><th>كود المدرس</th><th>اسم المدرس</th><th>المواد المسندة</th><th>عدد المواد</th></tr></thead><tbody id="rows"></tbody></table></div><p id="status" role="status"></p></section></main><script type="module">
import{createClient}from'https://esm.sh/@supabase/supabase-js@2.57.0';
const db=createClient('https://uqjoxgcddpwfbjanzqpy.supabase.co','sb_publishable_-FhtYmDD0qO6mEB2nBE_rQ_j_SE_unY'),$=id=>document.getElementById(id);let all=[],visible=[];
const normalize=v=>String(v??'').toLocaleLowerCase('ar').trim();
function render(){const query=normalize($('search').value),subject=$('subjectFilter').value;visible=all.filter(t=>(!subject||t.names.includes(subject))&&normalize([t.code,t.name,...t.names].join(' ')).includes(query));const body=$('rows');body.replaceChildren();for(const t of visible){const tr=document.createElement('tr');for(const value of [t.code,t.name,t.names.join('، ')||'لا توجد مواد مسندة',t.names.length]){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr)}if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=4;td.textContent='لا توجد نتائج مطابقة';tr.append(td);body.append(tr)}$('summary').textContent='عدد المدرسين: '+visible.length+' | إجمالي ارتباطات المواد: '+visible.reduce((n,t)=>n+t.names.length,0)}
$('search').oninput=render;$('subjectFilter').onchange=render;
$('export').onclick=()=>{const cells=[['كود المدرس','اسم المدرس','المواد المسندة','عدد المواد'],...visible.map(t=>[t.code,t.name,t.names.join(' | '),t.names.length])];const csv='\uFEFF'+cells.map(row=>row.map(v=>'"'+String(v??'').replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='تقرير_المواد_حسب_المدرس.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
(async()=>{try{const {data:{user},error:e}=await db.auth.getUser();if(e||!user)throw Error('يرجى تسجيل الدخول');const {data:profile,error:pe}=await db.from('staff_profiles').select('role,is_active').eq('user_id',user.id).single();if(pe||!profile?.is_active)throw Error('الحساب غير نشط');const {data:perms,error:pr}=await db.from('user_permissions').select('permission');if(pr)throw pr;const permissions=new Set((perms||[]).map(x=>x.permission));if(profile.role!=='super_admin'&&!permissions.has('reports.view')&&!permissions.has('teachers.view'))throw Error('لا تملك صلاحية التقرير');
const [a,b,c]=await Promise.all([db.from('teachers').select('id,teacher_code,full_name').eq('is_archived',false).order('full_name').limit(2000),db.from('academic_subjects').select('id,subject_name').limit(2000),db.from('person_subjects').select('person_id,subject_id').eq('person_kind','teachers').limit(10000)]);
for(const x of [a,b,c])if(x.error)throw x.error;
const nameById=new Map((b.data||[]).map(x=>[x.id,x.subject_name]));const linked=new Map();for(const x of c.data||[]){if(!linked.has(x.person_id))linked.set(x.person_id,new Set());const label=nameById.get(x.subject_id);if(label)linked.get(x.person_id).add(label)}
all=(a.data||[]).map(t=>({code:t.teacher_code||'—',name:t.full_name,names:[...(linked.get(t.id)||[])].sort((a,b)=>a.localeCompare(b,'ar'))}));
const allSubjects=[...new Set(all.flatMap(t=>t.names))].sort((a,b)=>a.localeCompare(b,'ar'));for(const name of allSubjects){const option=document.createElement('option');option.value=name;option.textContent=name;$('subjectFilter').append(option)}render();}catch(err){$('status').textContent='تعذر عرض التقرير: '+(err.message||err)}})();
</script></body></html>
