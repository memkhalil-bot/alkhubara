<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#153f33">
<title>توقف مؤقت للصيانة | مركز الخبراء التعليمي</title>
<style>
:root{color-scheme:light;font-family:Tahoma,Arial,sans-serif;color:#193d32;background:#f5f7f6}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px}
main{width:min(100%,560px);background:#fff;border:1px solid #d9e7de;border-radius:22px;padding:clamp(26px,6vw,52px);box-shadow:0 14px 40px rgba(17,67,46,.07);text-align:center}
.emblem{margin:auto auto 24px;width:76px;height:76px;border-radius:22px;background:#eaf4ed;display:grid;place-items:center;color:#176247}
.emblem svg{height:38px;width:38px}
h1{margin:0 0 13px;font-size:clamp(25px,5vw,33px);line-height:1.5;color:#123d30}
p{font-size:16px;line-height:2;margin:0 0 18px;color:#536b5f}
.note{border-top:1px solid #e2eee5;padding-top:22px;margin-top:24px;color:#667d70;font-size:13px;line-height:1.9}
.brand{font-weight:700;letter-spacing:.05px;font-size:14px;color:#12634d;margin-bottom:24px}
</style>
</head>
<body>
<main role="main" aria-labelledby="maintenance-title">
<div class="brand">مركز الخبراء التعليمي</div>
<div class="emblem" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16M5 20V6l7-3 7 3v14M9 9h.01M15 9h.01M9 13h.01M15 13h.01M10 20v-4h4v4"/></svg></div>
<h1 id="maintenance-title">النظام متوقف مؤقتًا للصيانة</h1>
<p>نعمل حاليًا على صيانة وتحديث نظام مركز الخبراء التعليمي لتحسين الخدمة.</p>
<p>خدمات النظام غير متاحة في الوقت الحالي. نشكركم على تفهّمكم.</p>
<div class="note">سيتم استئناف تشغيل النظام عند الانتهاء من أعمال الصيانة.</div>
</main>
</body>
</html>
